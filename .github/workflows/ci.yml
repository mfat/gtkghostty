name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkgconf libgtk-4-dev gobject-introspection \
            libgirepository1.0-dev python3-gi python3-pytest gir1.2-gtk-4.0 \
            xvfb xauth xdotool x11-xserver-utils

      # Pinned Zig and release tarballs, so the script is the cache key.
      - name: Cache libghostty-vt
        id: vt-cache
        uses: actions/cache@v4
        with:
          path: ~/deps/ghostty-vt
          key: ghostty-vt-linux-${{ hashFiles('packaging/windows/build-libghostty-vt.py') }}

      - name: Build libghostty-vt
        if: steps.vt-cache.outputs.cache-hit != 'true'
        run: python3 packaging/windows/build-libghostty-vt.py --target native --prefix ~/deps/ghostty-vt

      - name: Build
        run: |
          export PKG_CONFIG_PATH=~/deps/ghostty-vt/lib/pkgconfig
          meson setup _build
          meson compile -C _build

      - name: Test
        env:
          GDK_BACKEND: x11
          LIBGHOSTTY_VT_LIBDIR: /home/runner/deps/ghostty-vt/lib
        run: xvfb-run -a tests/run.sh _build -rs

  linux-libghostty-vt:
    # Prebuilt libghostty-vt for applications that bundle it without building
    # Zig themselves (SSH Pilot's deb, rpm and AppImage): glibc 2.31, baseline
    # CPU, relocatable. Each archive is tested by building and testing the
    # widget against it before a release attaches it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkgconf libgtk-4-dev gobject-introspection \
            libgirepository1.0-dev python3-gi python3-pytest gir1.2-gtk-4.0 \
            xvfb xauth xdotool x11-xserver-utils binutils

      - name: Package libghostty-vt
        run: packaging/linux/package-libghostty-vt.sh ${{ matrix.arch }} dist

      - name: Test the widget against the archive
        env:
          GDK_BACKEND: x11
        run: |
          mkdir -p "$RUNNER_TEMP/vt" && tar -xzf dist/libghostty-vt-*.tar.gz -C "$RUNNER_TEMP/vt"
          vt=$(echo "$RUNNER_TEMP"/vt/libghostty-vt-*)
          PKG_CONFIG_PATH="$vt/lib/pkgconfig" meson setup _build
          meson compile -C _build
          LIBGHOSTTY_VT_LIBDIR="$vt/lib" xvfb-run -a tests/run.sh _build -rs

      - uses: actions/upload-artifact@v4
        with:
          name: libghostty-vt-linux-${{ matrix.arch }}
          path: dist/libghostty-vt-*-linux-*.tar.gz*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/libghostty-vt-*-linux-*.tar.gz* --clobber

  macos:
    # Homebrew GTK 4, as GTK apps on macOS usually get it. GTK runs on the
    # runner's display; the keyboard tests need X11 and skip here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install meson ninja pkgconf gtk4 gobject-introspection pygobject3

      - name: Cache libghostty-vt
        id: vt-cache
        uses: actions/cache@v4
        with:
          path: ~/deps/ghostty-vt
          key: ghostty-vt-macos-${{ runner.arch }}-${{ hashFiles('packaging/windows/build-libghostty-vt.py') }}

      - name: Build libghostty-vt
        if: steps.vt-cache.outputs.cache-hit != 'true'
        run: python3 packaging/windows/build-libghostty-vt.py --target native --prefix ~/deps/ghostty-vt

      - name: Build
        run: |
          export PKG_CONFIG_PATH=~/deps/ghostty-vt/lib/pkgconfig
          meson setup _build
          meson compile -C _build

      - name: Test
        env:
          LIBGHOSTTY_VT_LIBDIR: /Users/runner/deps/ghostty-vt/lib
        run: |
          # Homebrew's Python is externally managed: pytest goes in a venv
          # that still sees Homebrew's PyGObject.
          python3 -m venv --system-site-packages _venv
          _venv/bin/pip install --quiet pytest pyobjc-framework-Quartz pyobjc-framework-Cocoa
          PATH="$PWD/_venv/bin:$PATH" tests/run.sh _build -rs

  windows-gvsbuild:
    # Visual Studio build against gvsbuild's GTK, for apps that ship gvsbuild
    # GTK with python.org Python (SSH Pilot's Windows installer). Produces the
    # zip packaging/windows/build-gvsbuild.ps1 describes; tagged releases
    # attach it.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build tools
        # setuptools: gvsbuild's g-ir-scanner imports distutils, which
        # Python 3.12 removed; setuptools provides it.
        run: python -m pip install meson ninja setuptools pytest

      - name: Cache libghostty-vt
        uses: actions/cache@v4
        with:
          path: _win/ghostty-vt
          key: ghostty-vt-windows-${{ hashFiles('packaging/windows/build-libghostty-vt.py') }}

      - name: Build and package
        shell: pwsh
        run: packaging/windows/build-gvsbuild.ps1

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$PWD\_win\prefix\bin;$PWD\_win\ghostty-vt\bin;C:\gtk-build\gtk\x64\release\bin;$env:PATH"
          $env:GI_TYPELIB_PATH = "$PWD\_win\prefix\lib\girepository-1.0;C:\gtk-build\gtk\x64\release\lib\girepository-1.0"
          python -m pytest -q -p no:cacheprovider tests -rs

      - uses: actions/upload-artifact@v4
        with:
          name: gtkghostty-gvsbuild-x64
          path: gtkghostty-*-gvsbuild-*-x64.zip*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem gtkghostty-*-gvsbuild-*-x64.zip*).FullName --clobber
